<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataOrigin</title>
  <script>
    // Set the theme before first paint (saved choice, else the OS preference) so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("dataorigin-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23818CF8'/%3E%3Cstop offset='1' stop-color='%234338CA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='17' fill='url(%23g)'/%3E%3Cg fill='none' stroke='white' stroke-width='5.5'%3E%3Crect x='10' y='25' width='27' height='14' rx='7' transform='rotate(-45 23.5 32)'/%3E%3Crect x='27' y='25' width='27' height='14' rx='7' transform='rotate(-45 40.5 32)'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="#/">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4338CA"/></linearGradient></defs>
            <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#brand-g)"/>
            <rect x="2" y="2" width="60" height="28" rx="14" fill="#fff" opacity=".16"/>
            <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
            <g fill="none" stroke="#fff" stroke-width="5">
              <rect x="10" y="25" width="27" height="14" rx="7" transform="rotate(-45 23.5 32)"/>
              <rect x="27" y="25" width="27" height="14" rx="7" transform="rotate(-45 40.5 32)"/>
            </g>
          </svg>
          <span>DataOrigin</span>
        </a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

        <a href="#/lineage" data-nav="lineage"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7"/><path d="M18 11.5c0 3.5-4.5 4-10 5"/></svg>Lineage</a>
        <a href="#/experiments" data-nav="experiments"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6.2L4.8 18.6A1.6 1.6 0 0 0 6.2 21h11.6a1.6 1.6 0 0 0 1.4-2.4L14 9.2V3"/><path d="M7.3 15h9.4"/></svg>Experiments</a>
        <a href="#/verification" data-nav="verification"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.2c0 4.4-3 8.2-7 9.8-4-1.6-7-5.4-7-9.8V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>Verification</a>

    <main class="main">
      <div id="global-banner" hidden></div>
      <div id="app" tabindex="-1"></div>

  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
